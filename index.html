<!DOCTYPE html><html><head><meta charset="utf-8"><title>Toontown</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#0d2666;color:#fff;font:22px Arial,sans-serif}#ld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px;box-sizing:border-box}
#bar{width:280px;height:10px;border-radius:5px;background:#ffffff33;overflow:hidden}#bar i{display:block;height:100%;width:3%;background:#ffd84a;transition:width .3s}
#cfg{display:none;flex-direction:column;gap:10px;align-items:center;font-size:16px;max-width:520px}#cfg input{font:16px Arial;width:100%;padding:8px;border-radius:8px;border:0}#cfg button{font:18px Arial;padding:8px 22px;border-radius:10px;border:0;background:#ffc93a;color:#3a2000;cursor:pointer}</style></head>
<body><div id="ld"><div>Toontown</div><div id="bar"><i></i></div><div id="msg" style="font-size:15px;opacity:.75">Cargando…</div>
<div id="cfg"><div>¿De dónde bajo el juego? Pega el enlace de tu página de GitHub Pages (por ejemplo https://tu-usuario.github.io/toontown/).</div><input id="url" placeholder="https://tu-usuario.github.io/toontown/"><button id="ok">Jugar</button></div></div>
<script>
const DEFAULT_BASE='';const MAP={"assets/menu.js": "core", "assets/ttc_sz.js": "ttc", "assets/quests.js": "ttc", "assets/interiors.js": "ttc", "assets/cogs.js": "cogs", "assets/bldg.js": "cogs", "assets/tt_common.js": "tt", "assets/tt_2100.js": "tt", "assets/tt_2200.js": "tt", "assets/tt_2300.js": "tt", "assets/dg_sz.js": "dg", "assets/dg_common.js": "dg", "assets/dg_5100.js": "dg", "assets/dg_5200.js": "dg", "assets/dg_5300.js": "dg", "assets/mm_sz.js": "mm", "assets/mm_common.js": "mm", "assets/mm_4100.js": "mm", "assets/mm_4200.js": "mm", "assets/mm_4300.js": "mm"};const SIZES={"core": 9540922, "ttc": 2007539, "cogs": 4022848, "tt": 2254107, "dg": 2665380, "mm": 2996134};
(async()=>{const bar=document.querySelector('#bar i'),msg=document.getElementById('msg');
 // de dónde se bajan los paquetes: la misma carpeta si la página está en internet; si es el archivo descargado, el enlace guardado
 let BASE='';if(/^https?:/.test(location.protocol))BASE=location.href.replace(/[#?].*$/,'').replace(/[^/]*$/,'');
 else{try{BASE=localStorage.getItem('tt_base')||''}catch(e){}if(!BASE)BASE=DEFAULT_BASE;}
 if(!BASE){BASE=await new Promise(res=>{const c=document.getElementById('cfg');c.style.display='flex';msg.textContent='';
   document.getElementById('ok').onclick=()=>{let u=document.getElementById('url').value.trim();if(!u)return;if(!u.endsWith('/'))u+='/';try{localStorage.setItem('tt_base',u)}catch(e){}c.style.display='none';res(u)}});}
 try{if(!('DecompressionStream' in window))throw new Error('Este navegador no puede abrir el juego (falta DecompressionStream). Usa Chrome, Edge o Firefox actualizados.');
  const P={f:{},b:{}},U={},got={};
  async function pack(name,onp){if(got[name])return got[name];return got[name]=(async()=>{
    const r=await fetch(BASE+name+'.pak',{cache:'default'});if(!r.ok)throw new Error(name+'.pak: '+r.status);
    let bin;if(onp&&r.body){const rd=r.body.getReader(),parts=[];let n=0;for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);n+=value.length;onp(n/(SIZES[name]||n))}bin=new Blob(parts)}else bin=await r.blob();
    const txt=await new Response(bin.stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();const J=JSON.parse(txt);Object.assign(P.f,J.f);Object.assign(P.b,J.b)})().catch(e=>{got[name]=null;throw e})}
  const blob=(p)=>{if(U[p])return U[p];if(p in P.f)return U[p]=URL.createObjectURL(new Blob([P.f[p]],{type:'text/javascript'}));
   if(p in P.b){const s=atob(P.b[p]),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return U[p]=URL.createObjectURL(new Blob([u],{type:'audio/mpeg'}))}return null};
  // la página pide sus archivos con __url (si ya están) y __append (espera el paquete que falta y recién ahí agrega el <script>)
  window.__url=p=>blob(p)||p;
  window.__append=sc=>{const p=sc.getAttribute('src');if(p&&!/^blob:/.test(p)&&MAP[p]){pack(MAP[p]).then(()=>{sc.src=blob(p);document.head.appendChild(sc)},e=>{console.error(e);sc.onerror&&sc.onerror(e)});return}document.head.appendChild(sc)};
  window.__pack=pack;
  await pack('core',f=>{bar.style.width=Math.min(95,5+f*90)+'%'});bar.style.width='100%';
  for(const k of ['ttc','cogs'])pack(k).catch(()=>{});   // en segundo plano: el patio, las ToonTasks y los Cogs
  const page=location.hash==='#make'?'make':'game';
  const html=P.f[page].replace('__THREE__',__url('three'));
  document.open();document.write(html);document.close()}
 catch(e){msg.textContent=String(e.message||e)+' — Revisa el enlace ('+BASE+'). Para cambiarlo, borra los datos del sitio o escribe en la consola: localStorage.removeItem("tt_base")'}})();
</script></body></html>
